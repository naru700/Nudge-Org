<div class="home-container">
  <div class="home-content">
    <div class="setup-card">
      <div class="card-header">
        <h1 class="page-title">Meeting Setup</h1>
        <p class="page-subtitle">Configure your meeting session</p>
      </div>

      <form class="setup-form">
        <div class="form-group">
          <label for="position">Role / Position</label>
          <input id="position" type="text" pInputText placeholder="e.g. Business Analyst" [(ngModel)]="form.position"
            name="position" class="form-control" />
        </div>

        <div class="form-group">
          <label for="llm">Select Language Model</label>
          <p-dropdown id="llm" [options]="models" [(ngModel)]="selectedModel" placeholder="Select Model" name="llm"
            styleClass="nudge-dropdown"></p-dropdown>
        </div>

        <div class="form-group">
          <label for="prompt">Meeting Prompt</label>
          <textarea id="prompt" rows="5" pInputTextarea placeholder="Choose a prompt..." [(ngModel)]="form.prompt"
            name="prompt" class="form-control"></textarea>
        </div>

        <div class="form-group">
          <label for="customPrompt">Custom Prompt <span class="optional">(optional)</span></label>
          <textarea id="customPrompt" rows="5" pInputTextarea placeholder="Enter custom prompt..."
            [(ngModel)]="form.customPrompt" name="customPrompt" class="form-control"></textarea>
        </div>

        <div class="action-area">
          <button pButton type="button"
            [label]="(starting$ | async) ? 'Starting...' : 'Start Meeting'"
            [icon]="(starting$ | async) ? 'pi pi-spin pi-spinner' : 'pi pi-play'"
            class="start-btn"
            [disabled]="(starting$ | async) || !form.position.trim() || !form.prompt.trim() || !selectedModel"
            (click)="startSession()">
          </button>
        </div>

        <div *ngIf="error$ | async as error" class="session-error">
          {{ error }}
        </div>
      </form>
    </div>
  </div>
</div>
